services:
  # Go Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas_backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-atlasuser}
      - DB_PASSWORD=${DB_PASSWORD:-atlaspassword}
      - DB_NAME=${DB_NAME:-db_atlas_food}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-atlasredis123}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - mysql
      - redis
    networks:
      - atlas-network

  # Redis Cache & Broker
  redis:
    image: redis:7.2-alpine
    container_name: atlas_redis
    restart: always
    command: redis-server --save 60 1 --loglevel notice --requirepass ${REDIS_PASSWORD:-atlasredis123} --maxmemory 512mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - atlas-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: atlas_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-db_atlas_food}
      MYSQL_USER: ${DB_USER:-atlasuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-atlaspassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - atlas-network

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: atlas_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - atlas-network

  # Grafana (Metrics Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: atlas_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - atlas-network

  # phpMyAdmin Database GUI
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: atlas_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    depends_on:
      - mysql
    networks:
      - atlas-network

volumes:
  mysql-data:
  redis-data:
  grafana-data:

networks:
  atlas-network:
    name: atlas-network
    driver: bridge
