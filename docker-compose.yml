services:
  # Go Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas_backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Override DB_HOST agar menunjuk ke nama container 'mysql' (bukan localhost)
      - DB_HOST=mysql
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - mysql
    networks:
      - atlas-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: atlas_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: atlas_food
      MYSQL_USER: atlasuser
      MYSQL_PASSWORD: atlaspassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - atlas-network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: atlas_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - atlas-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: atlas_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - atlas-network

  # phpMyAdmin Database GUI
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: atlas_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - mysql
    networks:
      - atlas-network

volumes:
  mysql-data:
  grafana-data:

networks:
  atlas-network:
    name: atlas-network
    driver: bridge
