name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master, improvement/v1-recall-latest ]
  pull_request:
    branches: [ main, master, improvement/v1-recall-latest ]

jobs:
  # ====================================================
  # STAGE 1: CONTINUOUS INTEGRATION (CI)
  # Automated Unit Tests & Build Verification
  # ====================================================
  test-and-build:
    name: 🧪 Run Tests & Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true
          cache: true

      - name: 📦 Install Dependencies
        run: go mod download

      - name: 🧪 Run Unit Tests
        run: go test -v ./...

      - name: 🐳 Test Build Docker Image
        run: docker build -t atlas-food-backend:test .

  # ====================================================
  # STAGE 2: CONTINUOUS DEPLOYMENT (CD)
  # Auto Deploy to VPS Server via SSH
  # ====================================================
  deploy:
    name: 🚀 Deploy to VPS Server
    needs: test-and-build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/improvement/v1-recall-latest') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 🔑 SSH to VPS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            /root/apps/atlas_food/deploy.sh be ${{ github.ref_name }}
